<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title and page.url != '/' %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} 홈"><span class="brand-symbol" aria-hidden="true"></span>{{ site.title | escape }}</a>
      <nav class="header-nav" aria-label="주 메뉴">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>아티클</a>
        <a href="{{ '/series/' | relative_url }}"{% if page.url == '/series/' or page.collection == 'series' %} aria-current="page"{% endif %}>시리즈</a>
        <a href="https://github.com/vvineey/vvineey.github.io" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
      <details class="mobile-nav">
        <summary aria-label="메뉴 열기"><span></span><span></span><span></span></summary>
        <nav aria-label="모바일 메뉴">
          <a href="{{ '/' | relative_url }}">아티클</a>
          <a href="{{ '/series/' | relative_url }}">시리즈</a>
          <a href="https://github.com/vvineey/vvineey.github.io">GitHub ↗</a>
        </nav>
      </details>
    </div>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer"><div class="footer-inner"><span>{{ site.title | escape }}</span><a href="{{ '/series/' | relative_url }}">시리즈</a></div></footer>
</body>
</html>
